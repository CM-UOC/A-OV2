<title>The Appointed Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Cardo:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ============================================================
   Design tokens — "The Appointed Time"
   Palette derived from pigments used in ancient and medieval
   manuscript production. Neutrals are biased toward indigo.
   Light palette lives on bare :root; dark redefines tokens only.
   ============================================================ */

:root {
  color-scheme: light;

  /* ground & surfaces — cool limestone, not warm cream */
  --ground:      #E4E2DB;
  --ground-deep: #D9D6CD;
  --surface:     #EEECE6;
  --surface-2:   #F6F4EF;
  --surface-3:   #FBFAF7;
  --line:        #C6C2B6;
  --line-soft:   #D6D2C7;

  /* ink */
  --ink:      #16192A;
  --ink-2:    #363A4E;
  --muted:    #565A6E;
  --muted-2:  #6E7285;

  /* gold leaf — the single accent */
  --accent:       #9C7420;
  --accent-ink:   #7A5A14;
  --accent-soft:  rgba(156, 116, 32, 0.13);
  --accent-line:  rgba(156, 116, 32, 0.38);

  /* semantic (certainty), kept distinct from the accent */
  --cert-anchored:  #2A6F68;
  --cert-sequenced: #4C5674;
  --cert-contested: #9F4A36;
  --cert-symbolic:  #75406F;

  /* stage pigments: graphic value / text-safe value */
  --st-origins:          #6B4A2F;  --st-origins-ink:      #5E3F26;
  --st-foundations:      #4C5674;  --st-foundations-ink:  #434D69;
  --st-signs:            #2A6F68;  --st-signs-ink:        #1F5F58;
  --st-tribulation:      #9F4A36;  --st-tribulation-ink:  #8D4030;
  --st-adversaries:      #75406F;  --st-adversaries-ink:  #6A3A64;
  --st-cosmos:           #2E559B;  --st-cosmos-ink:       #2A4E8E;
  --st-parousia:         #9C7420;  --st-parousia-ink:     #7A5A14;
  --st-judgement:        #93375A;  --st-judgement-ink:    #85314F;
  --st-restoration:      #4A7538;  --st-restoration-ink:  #416830;

  --sel: rgba(156, 116, 32, 0.22);
  --scrim: rgba(28, 26, 22, 0.5);
  --shadow-sm: 0 1px 2px rgba(22, 25, 42, 0.06);
  --shadow-md: 0 6px 24px -10px rgba(22, 25, 42, 0.28);
  --shadow-lg: 0 24px 60px -24px rgba(22, 25, 42, 0.42);
  --star-opacity: 0;

  /* type */
  --f-display: "Cardo", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --f-body: "Archivo", "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --t-xs: 0.75rem;
  --t-sm: 0.8125rem;
  --t-base: 0.9375rem;
  --t-md: 1.0625rem;
  --t-lg: 1.375rem;
  --t-xl: 1.875rem;
  --t-2xl: 2.5rem;
  --t-3xl: 3.4rem;

  /* space */
  --sp-1: 0.25rem; --sp-2: 0.5rem;  --sp-3: 0.75rem; --sp-4: 1rem;
  --sp-5: 1.5rem;  --sp-6: 2rem;    --sp-7: 3rem;    --sp-8: 4.5rem;

  --radius: 3px;
  --radius-lg: 5px;
  --rail-w: 264px;
  --measure: 68ch;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground:      #0D111E;
    --ground-deep: #080B15;
    --surface:     #141A2A;
    --surface-2:   #1A2133;
    --surface-3:   #212940;
    --line:        #2C3549;
    --line-soft:   #222A3C;

    --ink:     #EAE8E2;
    --ink-2:   #C6C9D5;
    --muted:   #99A0B4;
    --muted-2: #838BA1;

    --accent:      #E0B75A;
    --accent-ink:  #EDCB80;
    --accent-soft: rgba(224, 183, 90, 0.14);
    --accent-line: rgba(224, 183, 90, 0.36);

    --cert-anchored:  #6EC0B4;
    --cert-sequenced: #9BA6C9;
    --cert-contested: #E0917A;
    --cert-symbolic:  #C892C0;

    --st-origins:      #C99A6C;  --st-origins-ink:      #C99A6C;
    --st-foundations:  #9BA6C9;  --st-foundations-ink:  #9BA6C9;
    --st-signs:        #6EC0B4;  --st-signs-ink:        #6EC0B4;
    --st-tribulation:  #E0917A;  --st-tribulation-ink:  #E0917A;
    --st-adversaries:  #C892C0;  --st-adversaries-ink:  #C892C0;
    --st-cosmos:       #8FB0E8;  --st-cosmos-ink:       #8FB0E8;
    --st-parousia:     #E5BE66;  --st-parousia-ink:     #E5BE66;
    --st-judgement:    #E489A8;  --st-judgement-ink:    #E489A8;
    --st-restoration:  #98C97A;  --st-restoration-ink:  #98C97A;

    --sel: rgba(224, 183, 90, 0.26);
  --scrim: rgba(4, 6, 12, 0.62);
    --scrim: rgba(4, 6, 12, 0.62);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 6px 24px -10px rgba(0, 0, 0, 0.66);
    --shadow-lg: 0 24px 60px -24px rgba(0, 0, 0, 0.8);
    --star-opacity: 1;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:      #0D111E;
  --ground-deep: #080B15;
  --surface:     #141A2A;
  --surface-2:   #1A2133;
  --surface-3:   #212940;
  --line:        #2C3549;
  --line-soft:   #222A3C;

  --ink:     #EAE8E2;
  --ink-2:   #C6C9D5;
  --muted:   #99A0B4;
  --muted-2: #838BA1;

  --accent:      #E0B75A;
  --accent-ink:  #EDCB80;
  --accent-soft: rgba(224, 183, 90, 0.14);
  --accent-line: rgba(224, 183, 90, 0.36);

  --cert-anchored:  #6EC0B4;
  --cert-sequenced: #9BA6C9;
  --cert-contested: #E0917A;
  --cert-symbolic:  #C892C0;

  --st-origins:      #C99A6C;  --st-origins-ink:      #C99A6C;
  --st-foundations:  #9BA6C9;  --st-foundations-ink:  #9BA6C9;
  --st-signs:        #6EC0B4;  --st-signs-ink:        #6EC0B4;
  --st-tribulation:  #E0917A;  --st-tribulation-ink:  #E0917A;
  --st-adversaries:  #C892C0;  --st-adversaries-ink:  #C892C0;
  --st-cosmos:       #8FB0E8;  --st-cosmos-ink:       #8FB0E8;
  --st-parousia:     #E5BE66;  --st-parousia-ink:     #E5BE66;
  --st-judgement:    #E489A8;  --st-judgement-ink:    #E489A8;
  --st-restoration:  #98C97A;  --st-restoration-ink:  #98C97A;

  --sel: rgba(224, 183, 90, 0.26);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 6px 24px -10px rgba(0, 0, 0, 0.66);
  --shadow-lg: 0 24px 60px -24px rgba(0, 0, 0, 0.8);
  --star-opacity: 1;
}

/* ============================================================
   Base: reset, elements, chrome, layout
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
html.is-locked, body.is-locked { overflow: hidden; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--t-base);
  line-height: 1.65;
  font-synthesis-weight: none;
  -webkit-font-smoothing: antialiased;
  overflow-wrap: break-word;
}

::selection { background: var(--sel); }

h1, h2, h3, h4 {
  font-family: var(--f-display);
  font-weight: 700;
  line-height: 1.15;
  text-wrap: balance;
  margin: 0;
  letter-spacing: 0.005em;
}
p { margin: 0; }

a { color: var(--accent-ink); text-decoration-color: var(--accent-line); text-underline-offset: 2px; }
a:hover { text-decoration-color: currentColor; }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; padding: 0; }

:where(a, button, input, select, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 2px;
}

canvas#starfield {
  position: fixed; inset: 0; width: 100%; height: 100%;
  z-index: 0; pointer-events: none;
  opacity: var(--star-opacity);
  transition: opacity 0.6s ease;
}

.skip-link {
  position: fixed; top: -100px; left: var(--sp-4); z-index: 200;
  background: var(--surface-3); color: var(--ink);
  padding: var(--sp-3) var(--sp-4); border: 1px solid var(--accent);
  border-radius: var(--radius); font-weight: 600;
}
.skip-link:focus { top: var(--sp-4); }

/* --- shared page furniture ------------------------------------------ */
.eyebrow {
  font-family: var(--f-mono); font-size: var(--t-xs); letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--accent-ink);
}
.page-head { max-width: var(--measure); margin-bottom: var(--sp-6); }
.page-head h1 { font-size: var(--t-2xl); margin: var(--sp-3) 0 var(--sp-4); }
.page-head p { color: var(--ink-2); font-size: var(--t-md); }
.rule { height: 1px; background: var(--line); border: 0; margin: var(--sp-6) 0; }
.rule--gold { background: linear-gradient(90deg, var(--accent-line), transparent); height: 2px; }

.prose { max-width: var(--measure); }
.prose p + p { margin-top: var(--sp-4); }
.prose h2 { font-size: var(--t-lg); margin-top: var(--sp-6); margin-bottom: var(--sp-3); }
.prose h3 { font-size: var(--t-md); margin-top: var(--sp-5); margin-bottom: var(--sp-2); font-family: var(--f-body); font-weight: 700; }
.prose ul, .prose ol { margin: var(--sp-3) 0; padding-left: 1.2rem; color: var(--ink-2); }
.prose li + li { margin-top: var(--sp-2); }
.prose strong { color: var(--ink); font-weight: 600; }

.grid { display: grid; gap: var(--sp-4); }
.grid--2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grid--3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ============================================================
   Components
   ============================================================ */

/* --- labels, chips, apparatus --------------------------------------- */
.chip {
  display: inline-flex; align-items: center; gap: 0.35rem;
  font-family: var(--f-mono); font-size: 0.6875rem; letter-spacing: 0.06em;
  padding: 0.15rem 0.45rem; border-radius: 2px;
  border: 1px solid var(--line); color: var(--muted);
  background: var(--surface-2); white-space: nowrap;
}
.chip__dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }

.chip--cert { border-color: currentColor; background: transparent; }
.cert-anchored  { color: var(--cert-anchored); }
.cert-sequenced { color: var(--cert-sequenced); }
.cert-contested { color: var(--cert-contested); }
.cert-symbolic  { color: var(--cert-symbolic); }

.chip--source { text-transform: uppercase; }
.chip--comparative { color: var(--st-origins-ink); border-color: currentColor; background: transparent; }

.ref {
  font-family: var(--f-mono); font-size: var(--t-xs);
  color: var(--ink-2); background: var(--surface-2);
  border: 1px solid var(--line-soft); border-radius: 2px;
  padding: 0.1rem 0.35rem; white-space: nowrap; display: inline-block;
}
.ref--enoch { border-style: dashed; color: var(--st-origins-ink); }
.ref-list { display: flex; flex-wrap: wrap; gap: 0.35rem; }

.tag-btn {
  font-family: var(--f-mono); font-size: var(--t-xs);
  border: 1px solid var(--line); border-radius: 2px; padding: 0.15rem 0.45rem;
  color: var(--muted); background: transparent;
}
.tag-btn:hover { color: var(--accent-ink); border-color: var(--accent-line); }

/* --- panels ---------------------------------------------------------- */
.panel {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-lg); padding: var(--sp-5);
}
.panel--quiet { background: var(--surface-2); }
.panel h3 { font-family: var(--f-body); font-size: var(--t-base); font-weight: 700; margin-bottom: var(--sp-2); }
.panel p { color: var(--ink-2); }

.callout {
  border-left: 3px solid var(--accent); background: var(--accent-soft);
  padding: var(--sp-4) var(--sp-5); border-radius: 0 var(--radius) var(--radius) 0;
  max-width: var(--measure);
}
.callout__title {
  font-family: var(--f-mono); font-size: var(--t-xs); letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--accent-ink); margin-bottom: var(--sp-2);
}
.callout p { color: var(--ink-2); }
.callout p + p { margin-top: var(--sp-3); }

/* --- quotations ------------------------------------------------------ */
.quote {
  font-family: var(--f-display); font-size: 1.2rem; line-height: 1.5;
  color: var(--ink); border-left: 2px solid var(--accent-line);
  padding-left: var(--sp-4); margin: var(--sp-4) 0;
  max-width: 60ch;
}
.quote__attr {
  display: block; margin-top: var(--sp-2);
  font-family: var(--f-mono); font-size: var(--t-xs); font-style: normal;
  letter-spacing: 0.04em; color: var(--muted);
}

/* --- evidence / interpretation split -------------------------------- */
.split { display: grid; gap: var(--sp-3); margin-top: var(--sp-4); }
@media (min-width: 780px) { .split { grid-template-columns: 1fr 1fr; } }

.slab { border-radius: var(--radius); padding: var(--sp-4); border: 1px solid var(--line-soft); }
.slab__label {
  font-family: var(--f-mono); font-size: 0.6875rem; letter-spacing: 0.14em;
  text-transform: uppercase; margin-bottom: var(--sp-2); display: flex; align-items: center; gap: 0.4rem;
}
.slab--text { background: var(--surface-2); }
.slab--text .slab__label { color: var(--cert-anchored); }
.slab--interp { background: transparent; border-style: dashed; }
.slab--interp .slab__label { color: var(--cert-symbolic); }
.slab p, .slab li { color: var(--ink-2); font-size: var(--t-sm); }
.slab ul { margin: 0; padding-left: 1rem; }
.slab li + li { margin-top: var(--sp-2); }
.slab li b { color: var(--ink); font-weight: 600; }

/* --- timeline column ------------------------------------------------- */
.timeline { position: relative; }

.stage-band { position: relative; padding: 0 0 var(--sp-7) 3.25rem; }
.stage-band::before {
  content: ""; position: absolute; left: 1.05rem; top: 0.5rem; bottom: 0;
  width: 2px; background: var(--stage-color); opacity: 0.32;
}
.stage-band:last-child::before { bottom: auto; height: 100%; }

.stage-head { position: relative; padding-bottom: var(--sp-4); }
.stage-head::before {
  content: ""; position: absolute; left: -2.6rem; top: 0.55rem;
  width: 13px; height: 13px; border-radius: 50%;
  background: var(--ground); border: 2px solid var(--stage-color);
}
.stage-head__num {
  font-family: var(--f-mono); font-size: var(--t-xs); letter-spacing: 0.16em;
  color: var(--stage-ink); text-transform: uppercase;
}
.stage-head h2 { font-size: var(--t-xl); margin: var(--sp-2) 0; color: var(--ink); }
.stage-head p { color: var(--muted); max-width: 62ch; font-size: var(--t-sm); }

.event-list { display: grid; gap: var(--sp-3); }

/* --- event card ------------------------------------------------------ */
.event {
  position: relative; background: var(--surface); border: 1px solid var(--line);
  border-left: 3px solid var(--stage-color); border-radius: var(--radius);
  transition: border-color 0.18s ease, transform 0.36s ease, opacity 0.36s ease, box-shadow 0.18s ease;
}
.event:hover { box-shadow: var(--shadow-sm); border-color: var(--line); }
.event[data-open="true"] { box-shadow: var(--shadow-md); }
.stage-band .event::after {
  content: ""; position: absolute; left: -2.25rem; top: 1.4rem;
  width: 7px; height: 7px; border-radius: 50%; background: var(--stage-color); opacity: 0.55;
}

.event.is-reveal { opacity: 0; transform: translateY(12px); }
.event.is-in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  .event.is-reveal { opacity: 1; transform: none; }
  .event { transition: none; }
}

.event__btn {
  display: grid; grid-template-columns: 1fr auto; gap: var(--sp-4);
  align-items: start; width: 100%; text-align: left; padding: var(--sp-4) var(--sp-5);
}
.event__idx {
  font-family: var(--f-mono); font-size: 0.6875rem; color: var(--muted-2);
  letter-spacing: 0.1em; display: block; margin-bottom: 0.3rem;
}
.event__title { font-family: var(--f-display); font-size: 1.3rem; font-weight: 700; line-height: 1.2; color: var(--ink); }
.event__summary { color: var(--ink-2); font-size: var(--t-sm); margin-top: 0.4rem; max-width: 64ch; }
.event__meta { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: var(--sp-3); }
.event__caret { color: var(--muted); font-family: var(--f-mono); font-size: var(--t-xs); padding-top: 0.3rem; }
.event[data-open="true"] .event__caret { color: var(--accent-ink); }

.event__body { padding: 0 var(--sp-5) var(--sp-5); border-top: 1px solid var(--line-soft); margin-top: var(--sp-1); padding-top: var(--sp-4); }
.event__body[hidden] { display: none; }

.field { margin-top: var(--sp-4); }
.field__label {
  font-family: var(--f-mono); font-size: 0.6875rem; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--muted-2); margin-bottom: var(--sp-2);
}
.field p { color: var(--ink-2); font-size: var(--t-sm); }

.enoch-note {
  border: 1px dashed var(--st-origins); border-radius: var(--radius);
  padding: var(--sp-3) var(--sp-4); background: transparent; margin-top: var(--sp-2);
}
.enoch-note__head {
  font-family: var(--f-mono); font-size: 0.6875rem; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--st-origins-ink); margin-bottom: var(--sp-2);
  display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;
}
.enoch-note p { font-size: var(--t-sm); color: var(--ink-2); }

.related { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.related button {
  font-size: var(--t-xs); font-family: var(--f-mono); color: var(--accent-ink);
  border: 1px solid var(--accent-line); border-radius: 2px; padding: 0.15rem 0.45rem;
}
.related button:hover { background: var(--accent-soft); }

.event.is-flash { animation: flash 1.6s ease; }
@keyframes flash { 0%, 100% { box-shadow: none; } 20% { box-shadow: 0 0 0 3px var(--accent-soft); } }
@media (prefers-reduced-motion: reduce) { .event.is-flash { animation: none; } }

/* --- filters --------------------------------------------------------- */
.filters {
  position: sticky; top: 0; z-index: 40; margin-bottom: var(--sp-5);
  background: color-mix(in srgb, var(--ground) 94%, transparent);
  backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: var(--radius-lg);
}
@media (max-width: 1039px) { .filters { top: 52px; } }
.filters__bar { display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: center; padding: var(--sp-3) var(--sp-4); }
.filters__count { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--muted); margin-right: auto; }
.filters__count b { color: var(--ink); font-weight: 500; }

.search-inline {
  display: flex; align-items: center; gap: var(--sp-2);
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface-2); padding: 0.3rem var(--sp-3); min-width: 220px;
}
.search-inline input { border: none; background: none; outline: none; width: 100%; font-size: var(--t-sm); }
.search-inline input::placeholder { color: var(--muted-2); }
.search-inline svg { width: 14px; height: 14px; color: var(--muted); flex: none; }

.filters__panel { padding: 0 var(--sp-4) var(--sp-4); border-top: 1px solid var(--line-soft); display: grid; gap: var(--sp-4); }
.filters__panel[hidden] { display: none; }
.fgroup { padding-top: var(--sp-3); }
.fgroup__label {
  font-family: var(--f-mono); font-size: 0.6875rem; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--muted-2); margin-bottom: var(--sp-2);
}
.fgroup__opts { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.opt {
  display: inline-flex; align-items: center; gap: 0.4rem;
  font-size: var(--t-xs); font-family: var(--f-mono);
  border: 1px solid var(--line); border-radius: 2px; padding: 0.2rem 0.5rem;
  color: var(--ink-2); background: var(--surface-2);
}
.opt:hover { border-color: var(--accent-line); }
.opt[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 500; }
.opt__n { color: var(--muted-2); font-size: 0.625rem; }
.opt[aria-pressed="true"] .opt__n { color: var(--accent-ink); }

.legend { display: flex; flex-wrap: wrap; gap: var(--sp-3) var(--sp-4); padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--line-soft); }
.legend__item { display: flex; align-items: center; gap: 0.45rem; font-size: var(--t-xs); color: var(--muted); font-family: var(--f-mono); }
.legend__swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }

.empty { text-align: center; padding: var(--sp-8) var(--sp-4); color: var(--muted); }
.empty h3 { font-family: var(--f-display); font-size: var(--t-lg); color: var(--ink); margin-bottom: var(--sp-2); }

/* --- mirror (beginning & end) ---------------------------------------- */
.mirror-pair {
  display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--radius-lg);
  overflow: hidden; background: var(--surface); margin-bottom: var(--sp-4);
}
@media (min-width: 860px) { .mirror-pair { grid-template-columns: 1fr auto 1fr; } }
.mirror-side { padding: var(--sp-5); }
.mirror-side--a { border-left: 3px solid var(--st-origins); }
.mirror-side--b { border-left: 3px solid var(--st-restoration); background: var(--surface-2); }
@media (min-width: 860px) { .mirror-side--b { border-left: 1px solid var(--line); border-right: 3px solid var(--st-restoration); } }
.mirror-side__label {
  font-family: var(--f-mono); font-size: 0.6875rem; letter-spacing: 0.14em; text-transform: uppercase;
  margin-bottom: var(--sp-2);
}
.mirror-side--a .mirror-side__label { color: var(--st-origins-ink); }
.mirror-side--b .mirror-side__label { color: var(--st-restoration-ink); }
.mirror-side h3 { font-family: var(--f-display); font-size: 1.2rem; margin-bottom: var(--sp-2); }
.mirror-side p { font-size: var(--t-sm); color: var(--ink-2); margin-bottom: var(--sp-3); }
.mirror-hinge {
  display: none; align-items: center; justify-content: center;
  padding: 0 var(--sp-3); background: var(--surface-2); border-left: 1px solid var(--line);
}
@media (min-width: 860px) { .mirror-hinge { display: flex; } }
.mirror-hinge span {
  writing-mode: vertical-rl; font-family: var(--f-mono); font-size: 0.625rem;
  letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted-2);
}
.mirror-motif { padding: var(--sp-3) var(--sp-5); border-top: 1px solid var(--line-soft); grid-column: 1 / -1; }
.mirror-motif span { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--muted); }

/* --- sequences (contested order) ------------------------------------- */
.lanes { display: grid; gap: var(--sp-4); grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); align-items: start; }
.lane { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); overflow: hidden; }
.lane__head { padding: var(--sp-4); border-bottom: 1px solid var(--line-soft); border-top: 3px solid var(--lane-color); }
.lane__head h3 { font-family: var(--f-display); font-size: 1.15rem; }
.lane__head p { font-size: var(--t-xs); color: var(--muted); margin-top: var(--sp-2); }
.lane__steps { list-style: none; margin: 0; padding: var(--sp-3) var(--sp-4) var(--sp-4); counter-reset: step; }
.lane__steps li { position: relative; padding-left: 1.9rem; padding-bottom: var(--sp-3); counter-increment: step; }
.lane__steps li::before {
  content: counter(step); position: absolute; left: 0; top: 0.1rem;
  font-family: var(--f-mono); font-size: 0.625rem; color: var(--lane-color);
  border: 1px solid var(--lane-color); border-radius: 50%;
  width: 1.25rem; height: 1.25rem; display: grid; place-items: center;
}
.lane__steps li::after {
  content: ""; position: absolute; left: 0.6rem; top: 1.5rem; bottom: 0.2rem;
  width: 1px; background: var(--line);
}
.lane__steps li:last-child { padding-bottom: 0; }
.lane__steps li:last-child::after { display: none; }
.lane__step-title { font-weight: 600; font-size: var(--t-sm); color: var(--ink); }
.lane__step-note { font-size: var(--t-xs); color: var(--muted); margin-top: 0.2rem; }

.divergence { border: 1px solid var(--line); border-left: 3px solid var(--cert-contested); border-radius: var(--radius); padding: var(--sp-4); background: var(--surface); }
.divergence h4 { font-family: var(--f-body); font-weight: 700; font-size: var(--t-sm); margin-bottom: var(--sp-2); }
.divergence p { font-size: var(--t-sm); color: var(--ink-2); }

/* --- frameworks ------------------------------------------------------ */
.fw-card {
  border: 1px solid var(--line); border-top: 3px solid var(--fw-color);
  border-radius: var(--radius); background: var(--surface); padding: var(--sp-5);
  display: flex; flex-direction: column; gap: var(--sp-3);
}
.fw-card h3 { font-family: var(--f-display); font-size: 1.3rem; }
.fw-card__kind { font-family: var(--f-mono); font-size: 0.625rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fw-color); }
.fw-card__thesis { font-size: var(--t-sm); color: var(--ink-2); }
.fw-card__sec { font-size: var(--t-sm); }
.fw-card__sec h4 { font-family: var(--f-mono); font-size: 0.6875rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted-2); margin-bottom: var(--sp-2); font-weight: 400; }
.fw-card ul { margin: 0; padding-left: 1rem; color: var(--ink-2); }
.fw-card li + li { margin-top: 0.35rem; }
.fw-card__foot { margin-top: auto; padding-top: var(--sp-3); border-top: 1px solid var(--line-soft); display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); flex-wrap: wrap; }

.compare-tray {
  position: sticky; bottom: 0; z-index: 30; margin-top: var(--sp-5);
  background: var(--surface-3); border: 1px solid var(--accent-line); border-radius: var(--radius-lg);
  padding: var(--sp-3) var(--sp-4); display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
  box-shadow: var(--shadow-md);
}
.compare-tray__label { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--muted); }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); }
table.cmp { border-collapse: collapse; width: 100%; min-width: 640px; font-size: var(--t-sm); }
table.cmp th, table.cmp td { text-align: left; vertical-align: top; padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--line-soft); }
table.cmp thead th { background: var(--surface-2); font-family: var(--f-display); font-size: var(--t-md); border-bottom: 1px solid var(--line); }
table.cmp tbody th {
  font-family: var(--f-mono); font-size: 0.6875rem; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted-2); font-weight: 400; width: 150px; background: var(--surface-2);
}
table.cmp td { color: var(--ink-2); }
table.cmp tr:last-child td, table.cmp tr:last-child th { border-bottom: none; }

/* --- passage map ------------------------------------------------------ */
.map-wrap { display: grid; gap: var(--sp-4); }
@media (min-width: 1000px) { .map-wrap { grid-template-columns: 1fr 300px; align-items: start; } }
.map-frame { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); overflow-x: auto; }
.map-frame svg { display: block; min-width: 720px; width: 100%; height: auto; }
.map-col-label { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; fill: var(--muted-2); }
.map-node text { font-family: var(--f-body); font-size: 11px; fill: var(--ink-2); }
.map-node .map-ref { font-family: var(--f-mono); font-size: 9.5px; fill: var(--muted-2); }
.map-node rect { fill: var(--surface-2); stroke: var(--line); rx: 2; }
.map-node:hover rect, .map-node.is-active rect { stroke: var(--accent); fill: var(--accent-soft); }
.map-node:focus { outline: none; }
.map-node:focus-visible rect { stroke: var(--accent); stroke-width: 2; }
.map-node.is-dim { opacity: 0.32; }
.map-edge { fill: none; stroke: var(--line); stroke-width: 1; }
.map-edge.is-quotation { stroke: var(--accent); stroke-width: 1.6; }
.map-edge.is-allusion { stroke: var(--st-cosmos); }
.map-edge.is-shared { stroke: var(--st-origins); stroke-dasharray: 3 3; }
.map-edge.is-dim { opacity: 0.1; }
.map-edge.is-lit { opacity: 1; stroke-width: 2; }
.map-inspector { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); padding: var(--sp-4); }
.map-inspector h3 { font-family: var(--f-display); font-size: 1.15rem; margin-bottom: var(--sp-2); }
.map-inspector ul { list-style: none; margin: var(--sp-3) 0 0; padding: 0; }
.map-inspector li { padding: var(--sp-2) 0; border-top: 1px solid var(--line-soft); font-size: var(--t-sm); color: var(--ink-2); }

/* --- glossary --------------------------------------------------------- */
.alpha-index { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-bottom: var(--sp-5); }
.alpha-index a, .alpha-index span {
  font-family: var(--f-mono); font-size: var(--t-xs); padding: 0.15rem 0.4rem;
  border: 1px solid var(--line); border-radius: 2px; text-decoration: none; color: var(--ink-2);
}
.alpha-index span { color: var(--muted-2); opacity: 0.4; }
.term { border-bottom: 1px solid var(--line-soft); padding: var(--sp-4) 0; }
.term h3 { font-family: var(--f-display); font-size: 1.2rem; display: flex; align-items: baseline; gap: var(--sp-3); flex-wrap: wrap; }
.term__aka { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--muted); letter-spacing: 0.04em; }
.term p { color: var(--ink-2); font-size: var(--t-sm); margin: var(--sp-2) 0; max-width: var(--measure); }

/* --- sources ---------------------------------------------------------- */
.src { padding: var(--sp-3) 0; border-bottom: 1px solid var(--line-soft); font-size: var(--t-sm); color: var(--ink-2); max-width: var(--measure); }
.src b { color: var(--ink); font-weight: 600; }
.src cite { font-family: var(--f-display); font-style: italic; font-size: var(--t-md); color: var(--ink); }
.src__note { color: var(--muted); font-size: var(--t-xs); margin-top: 0.2rem; }

/* --- search overlay ---------------------------------------------------- */
.overlay { position: fixed; inset: 0; z-index: 100; display: grid; place-items: start center; padding: 8vh var(--sp-4) var(--sp-4); }
.overlay__scrim { position: absolute; inset: 0; background: var(--scrim); backdrop-filter: blur(3px); }
.overlay__panel {
  position: relative; width: min(680px, 100%); background: var(--surface-3);
  border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
  max-height: 78vh; display: flex; flex-direction: column; overflow: hidden;
}
.overlay__input { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-4); border-bottom: 1px solid var(--line); }
.overlay__input input { flex: 1; border: none; background: none; outline: none; font-size: var(--t-md); font-family: var(--f-display); }
.overlay__results { overflow-y: auto; padding: var(--sp-2); }
.res {
  display: block; width: 100%; text-align: left; padding: var(--sp-3); border-radius: var(--radius);
  border-left: 2px solid transparent;
}
.res:hover, .res.is-sel { background: var(--surface-2); border-left-color: var(--accent); }
.res__kind { font-family: var(--f-mono); font-size: 0.625rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted-2); }
.res__title { font-family: var(--f-display); font-size: 1.05rem; color: var(--ink); }
.res__sub { font-size: var(--t-xs); color: var(--muted); margin-top: 0.15rem; }
.overlay__foot { padding: var(--sp-2) var(--sp-4); border-top: 1px solid var(--line); font-family: var(--f-mono); font-size: var(--t-xs); color: var(--muted-2); display: flex; gap: var(--sp-4); }
kbd {
  font-family: var(--f-mono); font-size: 0.625rem; border: 1px solid var(--line);
  border-bottom-width: 2px; border-radius: 3px; padding: 0.05rem 0.3rem; color: var(--ink-2);
}

/* --- hero (introduction) ------------------------------------------------ */
.hero { position: relative; padding: var(--sp-6) 0 var(--sp-7); border-bottom: 1px solid var(--line); margin-bottom: var(--sp-7); }
.hero__eyebrow { margin-bottom: var(--sp-4); }
.hero h1 { font-size: var(--t-3xl); letter-spacing: -0.01em; max-width: 15ch; }
.hero__lede { font-family: var(--f-display); font-size: 1.4rem; line-height: 1.5; color: var(--ink-2); max-width: 46ch; margin-top: var(--sp-5); }
@media (max-width: 640px) { .hero h1 { font-size: 2.35rem; } .hero__lede { font-size: 1.2rem; } }
.hero__arc {
  display: flex; align-items: center; gap: var(--sp-3); margin-top: var(--sp-6);
  font-family: var(--f-mono); font-size: var(--t-xs); color: var(--muted); flex-wrap: wrap;
}
.hero__arc i { display: block; height: 2px; width: 40px; background: linear-gradient(90deg, var(--st-origins), var(--st-restoration)); }
.stat-row { display: flex; flex-wrap: wrap; gap: var(--sp-6); margin-top: var(--sp-6); }
.stat__n { font-family: var(--f-display); font-size: 2rem; color: var(--accent-ink); font-variant-numeric: tabular-nums; }
.stat__l { font-family: var(--f-mono); font-size: var(--t-xs); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

/* ============================================================
   The cinematic shell: layered atmosphere, scroll-driven scenes,
   HUD, scrubber, and the reading drawer.
   The journey is always a night sky; the theme toggle governs the
   reading surfaces that sit over it.
   ============================================================ */

:root {
  --hud-ink: #F3F0E7;
  --hud-dim: rgba(243, 240, 231, 0.62);
  --hud-line: rgba(243, 240, 231, 0.20);
  --hud-glass: rgba(10, 13, 22, 0.42);
  --scene-accent: #E0B75A;
}

body { background: #05070E; }

/* --- layers ---------------------------------------------------------- */
.layer { position: fixed; inset: 0; pointer-events: none; }
#sky { z-index: 0; }
#fg { z-index: 1; }
.layer--wash {
  z-index: 2;
  background:
    radial-gradient(120% 70% at 50% 108%, rgba(0, 0, 0, 0.55), transparent 60%),
    linear-gradient(180deg, rgba(0, 0, 0, 0.42), transparent 26%, transparent 62%, rgba(0, 0, 0, 0.40));
}
#skyFallback {
  position: fixed; inset: 0; z-index: 0;
  background: linear-gradient(180deg, #04060E 0%, #101A2F 46%, #2A2A3C 78%, #6B4A2F 100%);
}

/* --- journey --------------------------------------------------------- */
.journey { position: relative; z-index: 3; }

.scene { position: relative; min-height: 176vh; }
.scene:first-child { min-height: 190vh; }
.scene:last-child { min-height: 150vh; }

.scene__inner {
  position: sticky; top: 0; height: 100svh; height: 100vh;
  display: grid; align-content: center;
  padding: 0 clamp(1.25rem, 7vw, 7.5rem);
  will-change: transform, opacity;
}

.scene__caption {
  max-width: 44rem;
  opacity: var(--in, 1);
  transform: translateY(calc(34px * (1 - var(--in, 1)))) scale(calc(0.985 + 0.015 * var(--in, 1)));
  color: var(--hud-ink);
}

.scene__kicker {
  font-family: var(--f-mono); font-size: 0.6875rem; letter-spacing: 0.28em;
  text-transform: uppercase; color: var(--scene-accent);
  display: flex; align-items: center; gap: 0.75rem;
}
.scene__kicker::before {
  content: ""; width: clamp(24px, 6vw, 72px); height: 1px;
  background: linear-gradient(90deg, var(--scene-accent), transparent);
}

.scene__numeral {
  font-family: var(--f-mono); font-size: 0.75rem; letter-spacing: 0.3em;
  color: var(--hud-dim); margin-top: 1.4rem;
}

.scene__name {
  font-family: var(--f-display); font-weight: 700;
  font-size: clamp(2.6rem, 7.4vw, 5.6rem);
  line-height: 0.98; letter-spacing: -0.015em;
  margin: 0.5rem 0 0; color: var(--hud-ink);
  text-wrap: balance;
  text-shadow: 0 2px 40px rgba(0, 0, 0, 0.55);
}

.scene__line {
  font-family: var(--f-display); font-style: italic;
  font-size: clamp(1.05rem, 2.1vw, 1.5rem);
  line-height: 1.45; margin-top: 1.1rem; max-width: 34ch;
  color: rgba(243, 240, 231, 0.86);
}

.scene__quote {
  margin-top: 1.6rem; padding-left: 1.1rem;
  border-left: 1px solid var(--scene-accent);
  max-width: 40ch;
}
.scene__quote p {
  font-family: var(--f-display); font-size: clamp(1rem, 1.8vw, 1.2rem);
  line-height: 1.5; color: var(--hud-ink);
}
.scene__quote cite {
  display: block; margin-top: 0.45rem; font-style: normal;
  font-family: var(--f-mono); font-size: 0.6875rem; letter-spacing: 0.1em;
  color: var(--hud-dim);
}

/* --- animated glyph --------------------------------------------------- */
.glyph {
  position: absolute; right: clamp(1rem, 6vw, 7rem); top: 50%;
  width: clamp(160px, 26vw, 340px); height: auto;
  transform: translateY(-50%);
  color: var(--scene-accent);
  opacity: calc(0.34 * var(--in, 1));
  filter: drop-shadow(0 0 24px rgba(0, 0, 0, 0.5));
  pointer-events: none;
}
.glyph__p {
  stroke-dasharray: 620; stroke-dashoffset: 620;
  animation: draw 1900ms cubic-bezier(0.22, 0.68, 0.3, 1) forwards;
}
.scene.is-near .glyph__p { animation-play-state: running; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@media (max-width: 900px) {
  .glyph { right: 50%; top: 12%; transform: translate(50%, 0); width: 42vw; opacity: calc(0.18 * var(--in, 1)); }
}

/* --- entry beads ------------------------------------------------------ */
.beads {
  display: flex; gap: 0.5rem; margin-top: 2.2rem;
  overflow-x: auto; padding-bottom: 0.6rem;
  scroll-snap-type: x proximity;
  scrollbar-width: thin;
  max-width: min(58rem, 92vw);
  pointer-events: auto;
}
.beads::-webkit-scrollbar { height: 4px; }
.beads::-webkit-scrollbar-thumb { background: var(--hud-line); border-radius: 4px; }

.bead {
  flex: none; scroll-snap-align: start;
  display: grid; gap: 0.25rem; text-align: left;
  padding: 0.6rem 0.85rem; min-width: 12.5rem; max-width: 15rem;
  background: var(--hud-glass);
  border: 1px solid var(--hud-line);
  border-left: 2px solid var(--scene-accent);
  border-radius: 3px;
  backdrop-filter: blur(9px);
  color: var(--hud-ink);
  transition: transform 0.24s cubic-bezier(0.2, 0.7, 0.3, 1), background 0.24s ease, border-color 0.24s ease;
}
.bead:hover, .bead:focus-visible {
  transform: translateY(-3px);
  background: rgba(18, 22, 34, 0.68);
  border-color: rgba(243, 240, 231, 0.4);
}
.bead__n { font-family: var(--f-mono); font-size: 0.625rem; letter-spacing: 0.14em; color: var(--scene-accent); }
.bead__t { font-family: var(--f-display); font-size: 0.98rem; line-height: 1.22; }
.bead__r { font-family: var(--f-mono); font-size: 0.625rem; color: var(--hud-dim); }
.bead--more { border-left-color: var(--hud-line); min-width: 9rem; }
.bead--enoch { border-left-style: dashed; }

.scene__cue {
  margin-top: 1.6rem; display: flex; align-items: center; gap: 0.6rem;
  font-family: var(--f-mono); font-size: 0.625rem; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--hud-dim);
  opacity: var(--cue, 1);
}
.scene__cue i {
  display: block; width: 1px; height: 26px;
  background: linear-gradient(180deg, var(--scene-accent), transparent);
  animation: cue 2.6s ease-in-out infinite;
}
@keyframes cue { 0%, 100% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(6px); opacity: 1; } }

/* --- HUD -------------------------------------------------------------- */
.hud {
  position: fixed; z-index: 40; left: 0; right: 0; top: 0;
  display: flex; align-items: center; justify-content: space-between;
  gap: 1rem; padding: clamp(0.9rem, 2vw, 1.6rem) clamp(1rem, 4vw, 2.6rem);
  pointer-events: none;
}
.hud > * { pointer-events: auto; }
.hud__mark { display: grid; gap: 0.15rem; text-decoration: none; }
.hud__mark b {
  font-family: var(--f-display); font-size: 1.05rem; font-weight: 700;
  color: var(--hud-ink); letter-spacing: 0.01em;
}
.hud__mark span {
  font-family: var(--f-mono); font-size: 0.5625rem; letter-spacing: 0.24em;
  text-transform: uppercase; color: var(--hud-dim);
}
.hud__tools { display: flex; gap: 0.4rem; }

.ghost {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.42rem 0.7rem; border-radius: 3px;
  border: 1px solid var(--hud-line);
  background: var(--hud-glass); backdrop-filter: blur(9px);
  color: var(--hud-ink);
  font-family: var(--f-mono); font-size: 0.625rem; letter-spacing: 0.14em;
  text-transform: uppercase;
  transition: border-color 0.2s ease, background 0.2s ease;
}
.ghost:hover, .ghost:focus-visible { border-color: var(--scene-accent); }
.ghost[aria-pressed="true"] { border-color: var(--scene-accent); color: var(--scene-accent); }
.ghost svg { width: 13px; height: 13px; }
@media (max-width: 720px) { .ghost__label { display: none; } .ghost { padding: 0.45rem; } }

/* --- scrubber --------------------------------------------------------- */
.scrub {
  position: fixed; z-index: 40; right: clamp(0.9rem, 2.4vw, 2rem); top: 50%;
  transform: translateY(-50%);
  display: grid; gap: 0.55rem; justify-items: end;
}
.scrub__tick {
  display: flex; align-items: center; gap: 0.5rem;
  color: var(--hud-dim); background: none; border: none;

      { book: 'Isaiah', ref: 'Isaiah 52:13–53:12' },
      { book: 'Isaiah', ref: 'Isaiah 42:1–9; 49:1–7; 50:4–9', note: 'the other servant songs' },
      { book: 'Acts', ref: 'Acts 8:32–35' },
      { book: '1 Peter', ref: '1 Peter 2:22–25' }
    ],
    context: 'The four "servant songs" of Isaiah 40–55 come from the exilic period. Within Isaiah, the servant is identified with Israel in several places (41:8; 49:3) while elsewhere having a mission to Israel (49:5–6) — a tension that has generated two long-standing readings, corporate and individual. Christian interpretation from the New Testament onward applies Isaiah 53 to Jesus; Jewish interpretation has more often read the servant as the people of Israel.',
    symbols: ['the lamb led to slaughter', 'the man of sorrows', 'the arm of the LORD'],
    themes: ['messiah', 'suffering'],
    certainty: 'sequenced',
    interpretations: [
      { framework: 'criticism', text: 'Debate continues over whether the songs originally described an individual prophet, the exilic community, or an idealised figure; the corporate reading is well attested within the book itself.' },
      { framework: 'jewish', text: 'A major strand of Jewish interpretation identifies the servant with Israel suffering among the nations, a reading found in medieval commentators such as Rashi.' },
      { framework: 'futurism', text: 'Christian frameworks generally agree that Isaiah 53 is fulfilled in the crucifixion; they differ chiefly over what remains outstanding in Isaiah 54–66.' }
    ],
    related: ['davidic-throne', 'pierced-one'],
    enoch: [] },

  { id: 'new-covenant', stage: 'foundations', order: 4, source: 'canonical',
    title: 'A covenant written on the heart',
    summary: 'Jeremiah and Ezekiel promise an inward transformation — law written internally, a new heart, God’s own Spirit given — as the basis of a restored relationship.',
    refs: [
      { book: 'Jeremiah', ref: 'Jeremiah 31:31–34' },
      { book: 'Ezekiel', ref: 'Ezekiel 36:24–28' },
      { book: 'Ezekiel', ref: 'Ezekiel 11:19–20' },
      { book: 'Luke', ref: 'Luke 22:20' },
      { book: '2 Corinthians', ref: '2 Corinthians 3:3–6' },
      { book: 'Hebrews', ref: 'Hebrews 8:8–12; 10:16–17' }
    ],
    quote: { text: 'I will put my law in their inward parts, and write it in their hearts; and will be their God, and they shall be my people.', ref: 'Jeremiah 31:33', translation: 'KJV' },
    context: 'Written around the fall of Jerusalem, these promises answer the failure of the Sinai covenant with an act of divine renewal rather than a renewed demand. Hebrews quotes Jeremiah 31 at length — the longest Old Testament quotation in the New Testament — to argue that the new covenant is already inaugurated.',
    symbols: ['heart of flesh for heart of stone', 'clean water sprinkled', 'the indwelling Spirit'],
    themes: ['covenant', 'restoration'],
    certainty: 'sequenced',
    interpretations: [
      { framework: 'amillennialism', text: 'The new covenant is inaugurated at the cross and Pentecost and is being realised now in the church, awaiting consummation.' },
      { framework: 'futurism', text: 'Classic dispensational readings distinguished a future national application to Israel from the present church-age benefits; later revisions of the system moderate this distinction.' },
      { framework: 'postmillennialism', text: 'The promise that "all shall know me" is read as pointing to a future era of widespread, genuine faith within history.' }
    ],
    related: ['joel-spirit', 'all-israel-saved', 'dry-bones'],
    enoch: [] },

  { id: 'dry-bones', stage: 'foundations', order: 5, source: 'canonical',
    title: 'The valley of dry bones',
    summary: 'A field of bones is reassembled and given breath. Ezekiel states the meaning himself: this is the restoration of a people who believe they are finished.',
    refs: [
      { book: 'Ezekiel', ref: 'Ezekiel 37:1–14' },
      { book: 'Ezekiel', ref: 'Ezekiel 37:15–28', note: 'two sticks made one; David as prince' },
      { book: 'Isaiah', ref: 'Isaiah 26:19' },
      { book: 'Daniel', ref: 'Daniel 12:2' }
    ],
    quote: { text: 'Behold, O my people, I will open your graves, and cause you to come up out of your graves, and bring you into the land of Israel.', ref: 'Ezekiel 37:12', translation: 'KJV' },
    context: 'Ezekiel 37:11 gives the vision its own interpretation: "these bones are the whole house of Israel". The primary sense is national restoration from exile, expressed through resurrection imagery. Whether the imagery also implies belief in individual resurrection is debated; Isaiah 26:19 and Daniel 12:2 are the passages where that belief becomes explicit.',
    symbols: ['bones and sinews', 'the four winds', 'opened graves'],
    themes: ['resurrection', 'restoration'],
    certainty: 'symbolic',
    interpretations: [
      { framework: 'criticism', text: 'Read as a metaphor for return from exile; the emergence of an explicit doctrine of bodily resurrection in Israel is usually located later, in Daniel 12 and Second Temple literature.' },
      { framework: 'futurism', text: 'Frequently read as a two-stage national restoration of Israel — regathering, then spiritual renewal — with Ezekiel 38–39 following.' },
      { framework: 'amillennialism', text: 'Read as fulfilled in the restoration of God’s people culminating in Christ, with the general resurrection as its final expression.' }
    ],
    related: ['daniel-resurrection', 'gog-magog', 'general-resurrection'],
    enoch: [] },

  { id: 'four-kingdoms', stage: 'foundations', order: 6, source: 'canonical',
    title: 'Four kingdoms and a stone cut without hands',
    summary: 'A statue of four metals is shattered by a stone that becomes a mountain filling the earth — a kingdom that outlasts every empire.',
    refs: [
      { book: 'Daniel', ref: 'Daniel 2:31–45' },
      { book: 'Daniel', ref: 'Daniel 7:1–8, 17', note: 'the same schema as four beasts' },
      { book: 'Daniel', ref: 'Daniel 8:20–22', note: 'Media-Persia and Greece named' }
    ],
    quote: { text: 'And in the days of these kings shall the God of heaven set up a kingdom, which shall never be destroyed.', ref: 'Daniel 2:44', translation: 'KJV' },
    context: 'The four-kingdom schema was a known way of periodising history in the Hellenistic Near East. Daniel 8:20–22 identifies two of the kingdoms explicitly as Media-Persia and Greece. The identification of the fourth is the fault line: critical scholarship and many historic interpreters read Babylon–Media–Persia–Greece, with the visions oriented to the persecution under Antiochus IV (167–164 BCE); a long traditional reading takes Babylon–Media/Persia–Greece–Rome.',
    symbols: ['head of gold', 'feet of iron and clay', 'the uncut stone', 'the mountain filling the earth'],
    themes: ['kingdom', 'nations'],
    certainty: 'contested',
    interpretations: [
      { framework: 'criticism', text: 'Dates the visions to the Maccabean crisis and reads the fourth kingdom as the Greek successor states, treating the detailed history in Daniel 11 as written after the events it describes (vaticinium ex eventu) up to 11:39.' },
      { framework: 'historicism', text: 'Reads the fourth kingdom as Rome and the divided feet as the states of Europe, with the stone-kingdom growing through history.' },
      { framework: 'futurism', text: 'Reads the fourth kingdom as Rome with a future revived form, and the stone as the return of Christ ending Gentile rule.' },
      { framework: 'preterism', text: 'Reads the stone-kingdom as established at the first coming of Christ, striking the fourth kingdom in the first century.' }
    ],
    related: ['son-of-man-daniel', 'little-horn', 'beast-from-sea'],
    enoch: [ { ref: '1 Enoch 85–90', relation: 'parallel',
      text: 'The Animal Apocalypse periodises the same history through a sequence of animals and seventy shepherds, ending in judgement and a new house. Both texts periodise history and end with divine intervention, but the schemes are independent.' } ]
  },

  { id: 'son-of-man-daniel', stage: 'foundations', order: 7, source: 'canonical',
    title: 'One like a son of man before the Ancient of Days',
    summary: 'After the beasts, a human figure comes with the clouds to the throne and receives dominion that will not pass away. This is the single most quoted image in New Testament eschatology.',
    refs: [
      { book: 'Daniel', ref: 'Daniel 7:9–14' },
      { book: 'Daniel', ref: 'Daniel 7:18, 22, 27', note: 'the kingdom given to the saints of the Most High' },
      { book: 'Matthew', ref: 'Matthew 24:30; 26:64' },
      { book: 'Mark', ref: 'Mark 13:26; 14:62' },
      { book: 'Revelation', ref: 'Revelation 1:7, 13; 14:14' }
    ],
    quote: { text: 'I saw in the night visions, and, behold, one like the Son of man came with the clouds of heaven, and came to the Ancient of days … and there was given him dominion, and glory, and a kingdom.', ref: 'Daniel 7:13–14', translation: 'KJV, abridged' },
    context: 'The figure is described by comparison — "one like a son of man", i.e. one in human form, over against the beasts that came up from the sea. In Daniel 7:18 and 27 the kingdom is given to "the saints of the Most High", which has led many interpreters to read the figure corporately or as Israel’s heavenly representative. In the Gospels, Jesus uses "the Son of Man" as his characteristic self-designation and cites Daniel 7:13 at his trial.',
    symbols: ['the clouds of heaven', 'thrones set', 'the fiery stream', 'books opened'],
    themes: ['messiah', 'judgement', 'kingdom'],
    certainty: 'anchored',
    interpretations: [
      { framework: 'criticism', text: 'Debate continues over whether the figure is an angelic being (often identified with Michael, cf. Daniel 12:1), a symbol of the faithful community, or a messianic individual. The Book of Parables and the Gospels both take an individual reading, independently or otherwise.' },
      { framework: 'preterism', text: 'Reads the coming "with the clouds" as movement toward the throne — an enthronement, not a descent to earth — and applies Gospel uses of it to Christ’s vindication and the judgement on Jerusalem in AD 70.' },
      { framework: 'futurism', text: 'Reads the Gospel citations as describing the visible return of Christ to earth, with Daniel 7 supplying the scene of his investiture.' }
    ],
    related: ['son-of-man-comes', 'enoch-son-of-man', 'great-white-throne'],
    enoch: [ { ref: '1 Enoch 46:1–6; 48:2–10; 62:1–16; 69:26–29', relation: 'parallel',
      text: 'The Book of Parables develops a "Son of Man" who is pre-existent, named before creation, seated on the throne of glory, and judges the kings and the mighty. This is the closest pre-Christian analogue to the Gospels’ usage. Its date is debated — most specialists now place it in the late first century BCE or the first century CE — so the direction of any influence cannot be assumed.' } ]
  },

  { id: 'seventy-weeks', stage: 'foundations', order: 8, source: 'canonical',
    title: 'The seventy weeks',
    summary: 'Daniel prays about Jeremiah’s seventy years and is answered with seventy weeks — a period ending in atonement, an anointed one cut off, and a desolating abomination.',
    refs: [
      { book: 'Daniel', ref: 'Daniel 9:24–27' },
      { book: 'Jeremiah', ref: 'Jeremiah 25:11–12; 29:10', note: 'the seventy years' },
      { book: 'Matthew', ref: 'Matthew 24:15' },
      { book: 'Mark', ref: 'Mark 13:14' }
    ],
    context: 'Seventy weeks — literally "seventy sevens" — is the most disputed chronological text in the Bible. The disputes are technical: which decree starts the count (Daniel 9:25 is grammatically ambiguous and the versification differs between traditions), whether the "weeks" are years, who the two anointed figures are, and whether the final week follows immediately or is separated from the sixty-nine. This site does not adjudicate the calculation and does not use it to date anything.',
    symbols: ['seventy sevens', 'the anointed one cut off', 'the covenant of one week'],
    themes: ['messiah', 'temple', 'imminence'],
    certainty: 'contested',
    interpretations: [
      { framework: 'criticism', text: 'Reads the sequence as ending with Antiochus IV: the anointed one cut off is the murdered high priest Onias III (171 BCE) and the desolation is the altar set up in the temple in 167 BCE.' },
      { framework: 'preterism', text: 'Reads the seventieth week as running through the ministry and death of Jesus, with the desolation fulfilled in the Roman destruction of the temple in AD 70.' },
      { framework: 'futurism', text: 'Reads a gap between the sixty-ninth and seventieth weeks, placing the final seven-year period in the future — the framework from which the modern seven-year tribulation scheme derives.' },
      { framework: 'historicism', text: 'Applies the year-day principle to the weeks and reads them as spanning from a Persian decree to the first century, with the wider prophetic periods extending through church history.' }
    ],
    related: ['abomination-desolation', 'man-of-lawlessness', 'jerusalem-destroyed'],
    enoch: [ { ref: '1 Enoch 93:1–10; 91:11–17', relation: 'parallel',
      text: 'The Apocalypse of Weeks divides all history into ten "weeks", with the writer’s own time in the seventh and judgement following. Periodising history into sevens is a shared Second Temple habit; the two schemes count different things and neither depends on the other.' } ]
  },

  { id: 'daniel-resurrection', stage: 'foundations', order: 9, source: 'canonical',
    title: 'Many who sleep in the dust shall awake',
    summary: 'The clearest statement of a two-outcome resurrection in the Hebrew Bible, set after a time of unequalled distress and the deliverance of those written in the book.',
    refs: [
      { book: 'Daniel', ref: 'Daniel 12:1–4' },
      { book: 'Daniel', ref: 'Daniel 12:13' },
      { book: 'Isaiah', ref: 'Isaiah 26:19' },
      { book: 'John', ref: 'John 5:28–29' },
      { book: 'Matthew', ref: 'Matthew 13:43', note: 'the righteous shine, cf. Daniel 12:3' }
    ],
    quote: { text: 'And many of them that sleep in the dust of the earth shall awake, some to everlasting life, and some to shame and everlasting contempt.', ref: 'Daniel 12:2', translation: 'KJV' },
    context: 'Daniel 12 links four things that later apocalyptic keeps together: unprecedented distress, the deliverance of a named remnant, resurrection to two destinies, and the shining of the wise. John 5:28–29 reproduces the two-outcome structure almost exactly. Whether "many" means "all" or a subset is discussed by commentators; Hebrew rabbîm can carry an inclusive sense.',
    symbols: ['sleep and awakening', 'the book of names', 'shining like the firmament'],
    themes: ['resurrection', 'judgement', 'suffering'],
    certainty: 'anchored',
    interpretations: [
      { framework: 'criticism', text: 'Widely regarded as the latest and clearest resurrection text in the Hebrew Bible, arising from the crisis of the 160s BCE, in which faithful Jews were dying precisely because of their faithfulness.' },
      { framework: 'amillennialism', text: 'Read with John 5:28–29 as a single general resurrection of the righteous and unrighteous at the return of Christ.' },
      { framework: 'premillennialism', text: 'Read as the resurrection of the righteous at Christ’s return, with the resurrection of the rest after the millennium (Revelation 20:5).' }
    ],
    related: ['great-tribulation', 'general-resurrection', 'great-white-throne'],
    enoch: [ { ref: '1 Enoch 51:1–5; 61:5; 104:2', relation: 'parallel',
      text: 'Enoch has the earth and Sheol "give back" what they have received, and promises the righteous that they will shine like the lights of heaven — very close in wording to Daniel 12:3. The relationship between the two texts is debated; shared idiom is the safest description.' } ]
  },

  { id: 'isaiah-apocalypse', stage: 'foundations', order: 10, source: 'canonical',
    title: 'Isaiah’s "little apocalypse"',
    summary: 'Four chapters in which the whole earth is emptied and judged, a feast is set on the mountain for all peoples, death is swallowed up, and the dead are promised life.',
    refs: [
      { book: 'Isaiah', ref: 'Isaiah 24:1–23' },
      { book: 'Isaiah', ref: 'Isaiah 25:6–8' },
      { book: 'Isaiah', ref: 'Isaiah 26:19–21' },
      { book: 'Isaiah', ref: 'Isaiah 27:1', note: 'Leviathan the fleeing serpent' },
      { book: '1 Corinthians', ref: '1 Corinthians 15:54', note: 'quotes Isaiah 25:8' },
      { book: 'Revelation', ref: 'Revelation 21:4', note: 'echoes Isaiah 25:8' }
    ],
    quote: { text: 'He will swallow up death in victory; and the Lord GOD will wipe away tears from off all faces.', ref: 'Isaiah 25:8', translation: 'KJV' },
    context: 'Isaiah 24–27 is often called a proto-apocalypse: judgement is universal rather than aimed at a named nation, the host of heaven is punished alongside the kings of the earth (24:21–22), and death itself is treated as an enemy to be destroyed. Its date is disputed, with most critical scholars placing it later than the eighth-century core of Isaiah.',
    symbols: ['the emptied earth', 'the banquet on the mountain', 'Leviathan', 'prisoners in the pit'],
    themes: ['judgement', 'resurrection', 'restoration', 'watchers'],
    certainty: 'symbolic',
    interpretations: [
      { framework: 'idealism', text: 'Read as a poetic vision of God’s final dealing with evil, not a sequence; the imagery is deliberately unlocated in time and place.' },
      { framework: 'futurism', text: 'Read as describing the tribulation and the kingdom that follows, with 24:21–22 taken as the imprisonment of spiritual powers.' },
      { framework: 'amillennialism', text: 'Isaiah 25:8 is read as fulfilled at the resurrection, following Paul’s own citation in 1 Corinthians 15:54.' }
    ],
    related: ['death-destroyed', 'no-more-death', 'judgement-of-angels'],
    enoch: [ { ref: '1 Enoch 10:11–14; 18:11–16; 21:1–6', relation: 'parallel',
      text: 'Isaiah 24:21–22 — the host of heaven shut in prison and visited after many days — is the biblical text closest to the Enochic account of imprisoned spiritual beings awaiting judgement.' } ]
  },

  { id: 'gog-magog', stage: 'foundations', order: 11, source: 'canonical',
    title: 'Gog of the land of Magog',
    summary: 'A northern coalition attacks a restored and unwalled people and is destroyed by direct divine action — an invasion narrative Revelation reuses at the far end of its timeline.',

      { book: 'Ezekiel', ref: 'Ezekiel 38:1–23' },
      { book: 'Ezekiel', ref: 'Ezekiel 39:1–29' },
      { book: 'Revelation', ref: 'Revelation 20:7–10' },
      { book: 'Revelation', ref: 'Revelation 19:17–18', note: 'the birds summoned, cf. Ezekiel 39:17–20' }
    ],
    context: 'Gog is not a nation but a figure "of the land of Magog", leading peoples named from the edges of Ezekiel’s known world. The oracle is placed after the restoration chapters and before the temple vision of Ezekiel 40–48. Revelation 20:8 uses "Gog and Magog" as a pair of names for the nations gathered after the thousand years, which is a use of the motif rather than a claim about the same event.',
    symbols: ['the far north', 'hooks in the jaws', 'the sacrificial feast of birds', 'seven months of burial'],
    themes: ['nations', 'judgement', 'restoration'],
    certainty: 'contested',
    interpretations: [
      { framework: 'futurism', text: 'Commonly read as a distinct future invasion of a regathered Israel; interpreters differ over whether it precedes the tribulation, opens it, or belongs to the end of the millennium. Attempts to identify the named peoples with modern states are contested and are not endorsed here.' },
      { framework: 'amillennialism', text: 'Read as the same reality Revelation 20:8 describes: a final, symbolic massing of hostility against God’s people, defeated without a battle.' },
      { framework: 'criticism', text: 'Read as a late addition to Ezekiel addressing the question of security after the return, using deliberately archaic and mythic geography rather than contemporary politics.' }
    ],
    related: ['satan-released', 'armageddon', 'dry-bones'],
    enoch: [] },

  { id: 'joel-spirit', stage: 'foundations', order: 12, source: 'canonical',
    title: 'The Spirit poured out, and signs above',
    summary: 'Joel promises prophecy distributed across every class and age, framed by wonders in heaven and earth before the great and terrible Day — the text Peter cites at Pentecost.',
    refs: [
      { book: 'Joel', ref: 'Joel 2:28–32', note: 'Joel 3:1–5 in Hebrew numbering' },
      { book: 'Joel', ref: 'Joel 3:1–16' },
      { book: 'Acts', ref: 'Acts 2:16–21' },
      { book: 'Romans', ref: 'Romans 10:13', note: 'quotes Joel 2:32' },
      { book: 'Revelation', ref: 'Revelation 6:12', note: 'sun black, moon as blood' }
    ],
    quote: { text: 'And it shall come to pass afterward, that I will pour out my spirit upon all flesh; and your sons and your daughters shall prophesy.', ref: 'Joel 2:28', translation: 'KJV' },
    context: 'Peter’s citation in Acts 2 is decisive for New Testament eschatology: he says "this is that", identifying the outpouring with an event in his own day, and he retains the cosmic signs in the quotation. This is the strongest evidence that the New Testament regards the last days as already begun — the "already and not yet" structure that runs through the rest of this site.',
    symbols: ['poured-out Spirit', 'blood, fire, pillars of smoke', 'the darkened sun'],
    themes: ['day-of-lord', 'imminence', 'restoration'],
    certainty: 'anchored',
    interpretations: [
      { framework: 'preterism', text: 'Takes Peter at his word and reads the whole citation, cosmic signs included, as fulfilled in the events of the first century, with the sign-language understood figuratively.' },
      { framework: 'futurism', text: 'Reads Pentecost as an initial or partial fulfilment, with the cosmic signs reserved for the period immediately before the return of Christ.' },
      { framework: 'amillennialism', text: 'Reads the passage as inaugurated at Pentecost and consummated at the end, with the "last days" spanning the entire period between.' }
    ],
    related: ['sun-darkened', 'new-covenant', 'gospel-to-nations'],
    enoch: [] },

  { id: 'pierced-one', stage: 'foundations', order: 13, source: 'canonical',
    title: 'They shall look on the one they pierced',
    summary: 'Zechariah’s closing chapters bring together a besieged Jerusalem, a struck shepherd, a pierced figure mourned by the city, a cleansing fountain, and the LORD standing on the Mount of Olives.',
    refs: [
      { book: 'Zechariah', ref: 'Zechariah 12:10' },
      { book: 'Zechariah', ref: 'Zechariah 13:1, 7–9' },
      { book: 'Zechariah', ref: 'Zechariah 14:1–9' },
      { book: 'Zechariah', ref: 'Zechariah 14:16–19', note: 'the nations keep the Feast of Booths' },
      { book: 'John', ref: 'John 19:37' },

    ],
    quote: { text: 'And his feet shall stand in that day upon the mount of Olives, which is before Jerusalem on the east.', ref: 'Zechariah 14:4', translation: 'KJV' },
    context: 'Zechariah 9–14 is usually treated as a distinct collection from chapters 1–8 and is among the most heavily quoted prophetic material in the passion narratives. Revelation 1:7 fuses Zechariah 12:10 with Daniel 7:13 in a single sentence — a good example of how the New Testament combines sources rather than citing them singly.',
    symbols: ['the pierced one', 'the struck shepherd', 'the split mountain', 'living waters flowing east and west'],
    themes: ['messiah', 'day-of-lord', 'nations', 'temple'],
    certainty: 'contested',
    interpretations: [
      { framework: 'futurism', text: 'Reads Zechariah 14 as a literal future descent to the Mount of Olives, a topographical change, and an ongoing kingdom in which nations come to Jerusalem.' },
      { framework: 'preterism', text: 'Reads the mourning of Zechariah 12:10 as fulfilled in the first century, and the descriptions in chapter 14 as prophetic idiom for that decisive intervention.' },
      { framework: 'idealism', text: 'Reads the geography symbolically: the mountain split and living water flowing outward are images of deliverance and of life reaching the whole world.' }
    ],
    related: ['son-of-man-comes', 'every-eye-sees', 'nations-stream'],
    enoch: [] },

  { id: 'malachi-messenger', stage: 'foundations', order: 14, source: 'canonical',
    title: 'The messenger, the refiner’s fire, and Elijah',
    summary: 'The Hebrew Bible’s final page promises a messenger to prepare the way, a purifying judgement beginning at the temple, and the return of Elijah before the Day.',
    refs: [
      { book: 'Malachi', ref: 'Malachi 3:1–5' },
      { book: 'Malachi', ref: 'Malachi 4:1–6', note: 'Malachi 3:19–24 in Hebrew numbering' },
      { book: 'Matthew', ref: 'Matthew 11:13–14; 17:10–13' },
      { book: 'Mark', ref: 'Mark 9:11–13' },
      { book: 'Luke', ref: 'Luke 1:16–17' },
      { book: 'Revelation', ref: 'Revelation 11:5–6', note: 'witnesses with Elijah-like powers' }
    ],
    quote: { text: 'Behold, I will send you Elijah the prophet before the coming of the great and dreadful day of the LORD.', ref: 'Malachi 4:5', translation: 'KJV' },
    context: 'In the Christian ordering of the Old Testament, Malachi’s Elijah promise is the last word before the Gospels — an arrangement that shapes how the New Testament opening reads. In the Hebrew ordering, Malachi is not last. The Gospels apply the promise to John the Baptist, while noting that John himself denied being Elijah (John 1:21), a tension the texts leave standing.',
    symbols: ['refiner’s fire and fuller’s soap', 'the sun of righteousness', 'hearts turned'],
    themes: ['messiah', 'day-of-lord', 'imminence'],
    certainty: 'contested',
    interpretations: [
      { framework: 'preterism', text: 'The Elijah promise is fully discharged in John the Baptist, on the authority of Matthew 11:14.' },
      { framework: 'futurism', text: 'John fulfils the promise typologically, with a further Elijah-like ministry before the end — sometimes connected with the two witnesses of Revelation 11.' },
      { framework: 'jewish', text: 'Jewish tradition continues to expect Elijah before the messianic age; the expectation is expressed liturgically at Passover and at circumcision.' }
    ],
    related: ['two-witnesses', 'elijah-question'],
    enoch: [] },

  { id: 'royal-psalms', stage: 'foundations', order: 15, source: 'canonical',
    title: 'The enthroned king and the coming judge',
    summary: 'The Psalms supply two images the New Testament uses constantly: a king installed on Zion who rules the nations, and a Lord seated at God’s right hand until his enemies are subdued.',
    refs: [
      { book: 'Psalms', ref: 'Psalm 2:1–12' },
      { book: 'Psalms', ref: 'Psalm 110:1–7' },
      { book: 'Psalms', ref: 'Psalm 96:11–13; 98:7–9', note: 'the LORD comes to judge the earth' },
      { book: 'Acts', ref: 'Acts 2:34–36' },
      { book: '1 Corinthians', ref: '1 Corinthians 15:25–27' },
      { book: 'Revelation', ref: 'Revelation 2:26–27; 12:5; 19:15', note: 'the rod of iron, from Psalm 2:9' }
    ],
    quote: { text: 'The LORD said unto my Lord, Sit thou at my right hand, until I make thine enemies thy footstool.', ref: 'Psalm 110:1', translation: 'KJV' },
    context: 'Psalm 110 is the most frequently cited Old Testament verse in the New Testament. Paul’s argument in 1 Corinthians 15:25–28 is built on it: Christ reigns now, "until" the last enemy is destroyed — a sequence that every millennial position must accommodate, and which each does differently.',
    symbols: ['the rod of iron', 'the footstool', 'Melchizedek', 'the nations raging'],
    themes: ['kingdom', 'messiah', 'judgement'],

    { term: 'Pseudonymity', def: 'Writing in another’s name. In apocalyptic literature it typically places a revelation in the mouth of an ancient figure, which lets the writer present history up to their own time as prophecy — a device scholars call vaticinium ex eventu, prophecy after the event.' }

/* Glossary of terms and symbols. */
(function (AD) {
