  AD.data.glossary = [
    { term: 'Already and not yet', def: 'The pattern by which the New Testament describes the last days as begun in Christ while awaiting completion. Often called inaugurated eschatology.', refs: ['Acts 2:16–17', 'Hebrews 6:5', '1 John 3:2'] },
    { term: 'Amillennialism', def: 'The view that the thousand years of Revelation 20 symbolise the present age between Christ’s comings, with one return, one resurrection, and one judgement.', refs: ['Revelation 20:1–6'], see: ['Recapitulation'] },
    { term: 'Antichrist', def: 'A term used only in 1 and 2 John, where it names those who deny that Jesus is the Christ come in the flesh, and is used in the plural of many present figures as well as one expected.', refs: ['1 John 2:18–22', '2 John 7'] },
    { term: 'Apocalypse', def: 'From Greek apokalypsis, "unveiling". As a genre: a narrative revelation given to a human recipient by an otherworldly being, disclosing a transcendent reality both temporal and spatial.', refs: ['Revelation 1:1'] },
    { term: 'Apocalyptic literature', def: 'The body of Jewish and Christian writing sharing that genre — Daniel 7–12, Revelation, 1 Enoch, 4 Ezra, 2 Baruch — typically written in periods of pressure and using vision, symbol, and heavenly mediation.', refs: [] },
    { term: 'Apocrypha', def: 'Books outside a given canon. Protestant usage applies it to the deuterocanonical books; Catholic usage applies it to what Protestants call pseudepigrapha. Always specify the tradition.', refs: [] },
    { term: 'Armageddon', def: 'Har-Magedon, "mountain of Megiddo" — the place where kings are gathered in Revelation 16:16. Megiddo was a strategic plain with no mountain, which has prompted several explanations.', refs: ['Revelation 16:12–16'] },
    { term: 'Babylon', def: 'The historical empire that destroyed Jerusalem in 586 BCE, and thereafter a symbol of imperial self-exaltation. Used of Rome in 1 Peter 5:13 and, on most readings, in Revelation 17–18.', refs: ['Genesis 11:9', 'Revelation 17:5'] },
    { term: 'Beast', def: 'In Daniel, a symbol for an empire rising from the sea; in Revelation, a composite of Daniel’s four, representing power that demands worship.', refs: ['Daniel 7:3–8', 'Revelation 13:1–10'] },
    { term: 'Bēma', def: 'The raised platform from which a magistrate gave judgement; Paul’s image for the assessment of believers’ work.', refs: ['Romans 14:10', '2 Corinthians 5:10'] },
    { term: 'Canon', def: 'The list of books a community receives as scripture. Canons differ between Jewish and Christian traditions and between churches.', refs: [] },
    { term: 'Chiliasm', def: 'The early name for belief in a literal earthly thousand-year reign — from Greek chilioi, "thousand". Held by Papias, Justin Martyr, and Irenaeus.', refs: ['Revelation 20:4–6'], see: ['Premillennialism'] },
    { term: 'Day of the LORD', def: 'A decisive divine intervention in judgement and deliverance. First attested in Amos, who reverses its popular sense; applied by the prophets to specific historical catastrophes and by the New Testament to the return of Christ.', refs: ['Amos 5:18–20', '1 Thessalonians 5:2'] },
    { term: 'Desolating sacrilege', def: 'Daniel’s phrase, traditionally "abomination of desolation", for a desecration of the sanctuary. Applied in Daniel to the altar erected under Antiochus IV, and reapplied in the Gospels.', refs: ['Daniel 11:31', 'Mark 13:14'] },
    { term: 'Dispensationalism', def: 'A system, developed in the nineteenth century, that divides history into administrations and maintains a permanent distinction between Israel and the church; the source of the pretribulational rapture scheme.', refs: [], see: ['Futurism', 'Rapture'] },
    { term: 'Eschatology', def: 'The study of "last things" — death, resurrection, judgement, and the final state — whether of the individual or of the world.', refs: [] },
    { term: 'Gehenna', def: 'The Valley of Hinnom outside Jerusalem, associated with child sacrifice in Jeremiah, used in the Gospels as an image of final judgement. Rendered "hell" in many English versions.', refs: ['Jeremiah 7:31', 'Mark 9:43–48'] },
    { term: 'Gematria', def: 'Assigning numerical values to letters. Revelation 13:18 invites calculation of the number 666; the most widely held proposal reads "Nero Caesar" in Hebrew characters.', refs: ['Revelation 13:18'] },
    { term: 'Gog and Magog', def: 'A figure and a land in Ezekiel’s invasion oracle; used in Revelation 20:8 as a name for the nations gathered after the thousand years.', refs: ['Ezekiel 38:2', 'Revelation 20:8'] },
    { term: 'Historicism', def: 'The view that Daniel and Revelation map the whole course of history from the apostolic age to the end.', refs: [], see: ['Year-day principle'] },
    { term: 'Idealism', def: 'The view that apocalyptic visions portray enduring spiritual realities symbolically rather than a sequence of datable events.', refs: [] },
    { term: 'Imminence', def: 'The New Testament’s insistence that the end is near and may come at any time, held together with its refusal to date it.', refs: ['Matthew 24:36', 'Revelation 22:10'] },
    { term: 'Lake of fire', def: 'The final destination named in Revelation 19–21, glossed by the text itself as "the second death".', refs: ['Revelation 20:14'] },
    { term: 'Man of lawlessness', def: 'Paul’s term in 2 Thessalonians 2 for a figure revealed after a restraint is removed, who exalts himself in the temple of God.', refs: ['2 Thessalonians 2:3–8'] },
    { term: 'Millennium', def: 'The thousand years of Revelation 20:1–6 — the only passage in the Bible that mentions them. Every millennial position is a way of reading these six verses.', refs: ['Revelation 20:1–6'] },
    { term: 'Nephilim', def: 'The beings named in Genesis 6:4, rendered "giants" in older translations; recalled by the spies in Numbers 13:33 and developed at length in 1 Enoch.', refs: ['Genesis 6:4', '1 Enoch 7:2'] },
    { term: 'Olivet Discourse', def: 'Jesus’ extended answer, delivered on the Mount of Olives, to a question about the destruction of the temple.', refs: ['Matthew 24–25', 'Mark 13', 'Luke 21'] },
    { term: 'Parousia', def: 'Greek for "arrival" or "presence", used of an official visit. The New Testament’s standard word for the coming of Christ.', refs: ['Matthew 24:27', '1 Thessalonians 4:15'] },
    { term: 'Postmillennialism', def: 'The view that Christ returns after an extended era of gospel success within history.', refs: ['Matthew 13:31–33'] },
    { term: 'Premillennialism', def: 'The view that Christ returns before a future thousand-year reign on earth.', refs: ['Revelation 19:11–20:6'] },
    { term: 'Preterism', def: 'From Latin praeter, "past". The view that most prophecy was fulfilled in the first century, principally in the events of AD 70. Partial preterism retains a future return; full preterism does not, and is rejected by the major churches.', refs: ['Matthew 24:34'] },
    { term: 'Pseudepigraphy', def: 'Attribution of a work to a revered figure of the past — a recognised convention in apocalyptic literature, and the reason the Enochic corpus bears Enoch’s name.', refs: [] },
    { term: 'Rapture', def: 'From Latin rapiemur, "we shall be caught up", in the Vulgate of 1 Thessalonians 4:17. Whether it names a distinct event before the tribulation, or the gathering at the single return, is disputed.', refs: ['1 Thessalonians 4:17'] },
    { term: 'Recapitulation', def: 'The principle that Revelation retells the same period from different angles rather than advancing chronologically. Whether it governs chapter 20 is the pivot of the millennial debate.', refs: ['Revelation 20:1–3'] },
    { term: 'Restrainer', def: 'The unidentified power that holds back the man of lawlessness in 2 Thessalonians 2:6–7. Paul had explained it in person; the meaning is not recoverable with confidence.', refs: ['2 Thessalonians 2:6–7'] },
    { term: 'Second death', def: 'Revelation’s term for the final outcome for those not found in the book of life, distinguished from bodily death.', refs: ['Revelation 20:14', 'Revelation 21:8'] },
    { term: 'Seventy weeks', def: 'The "seventy sevens" of Daniel 9:24–27, the most disputed chronological passage in the Bible, and the basis of the seven-year tribulation scheme in futurist readings.', refs: ['Daniel 9:24–27'] },
    { term: 'Sheol', def: 'The Hebrew Bible’s general term for the realm of the dead, largely undifferentiated. Rendered Hades in Greek; later literature, including 1 Enoch 22, divides it by moral outcome.', refs: ['Psalm 89:48', '1 Enoch 22'] },
    { term: 'Son of Man', def: 'In Daniel 7, "one like a son of man" — a human figure over against the beasts. In the Gospels, Jesus’ characteristic self-designation. Also a title in the Book of Parables of 1 Enoch.', refs: ['Daniel 7:13', 'Mark 14:62', '1 Enoch 46:1–4'] },
    { term: 'Symbolic numbers', def: 'Apocalyptic uses numbers for meaning as well as quantity: 7 completeness, 12 the people of God, 3½ or 1,260 days a bounded time of trial, 1,000 fullness, 144,000 as 12 × 12 × 1,000.', refs: ['Revelation 11:2–3', 'Revelation 7:4'] },
    { term: 'Tartarus', def: 'A Greek term for the place of the imprisoned Titans, used once in the New Testament, as a verb, of the confinement of the sinning angels.', refs: ['2 Peter 2:4'] },
    { term: 'Theophany', def: 'A description of God appearing — with fire, cloud, quaking, and accompanying holy ones. The formula runs from Deuteronomy 33:2 through 1 Enoch 1:9 to Jude 14.', refs: ['Deuteronomy 33:2', 'Habakkuk 3:3–6'] },
    { term: 'Tribulation', def: 'Greek thlipsis, "pressure". Used in the New Testament both of ordinary Christian hardship and of a distinctive period of distress; which sense applies where is disputed.', refs: ['John 16:33', 'Matthew 24:21'] },
    { term: 'Vaticinium ex eventu', def: '"Prophecy after the event": narrating past history as though foreseen, a recognised convention of apocalyptic pseudepigraphy. Critical scholarship applies the category to Daniel 11 and to parts of 1 Enoch.', refs: ['Daniel 11:2–39'] },
    { term: 'Watchers', def: 'The heavenly beings of 1 Enoch 6–16 who descend, take human wives, and teach forbidden knowledge. The term appears in the Bible only in Daniel 4, in a different sense.', refs: ['1 Enoch 10:9', 'Daniel 4:13'] },
    { term: 'Year-day principle', def: 'The historicist rule that a prophetic day represents a year, drawn from Numbers 14:34 and Ezekiel 4:6, and applied to the 1,260 days and the seventy weeks.', refs: ['Numbers 14:34', 'Ezekiel 4:6'] },
    { term: 'Cherubim', def: 'Winged guardian figures: stationed at the way to the tree of life, carved over the ark, and part of Ezekiel’s throne vision.', refs: ['Genesis 3:24', 'Ezekiel 10:1–22'] },
    { term: 'Leviathan', def: 'A sea creature representing chaos, defeated by God; named in Isaiah 27:1 in an eschatological context.', refs: ['Isaiah 27:1', 'Job 41:1'] },
    { term: 'Firstfruits', def: 'The first portion of a harvest, offered as a pledge of the rest. Paul uses it of Christ’s resurrection guaranteeing the general resurrection.', refs: ['1 Corinthians 15:20'] },
    { term: 'New Jerusalem', def: 'The holy city descending from heaven in Revelation 21, shaped as a cube like the holy of holies, identified with the bride, and having no temple.', refs: ['Revelation 21:2, 16, 22'] }
  ];

/* Long-form prose: introduction and methodology. */
(function (AD) {

  AD.data.intro = {
    eyebrow: 'Genesis 1 to Revelation 22',
    title: 'The Appointed Time',
    lede: 'An interactive chronology of what the biblical texts say about the beginning of all things and the end of the present age — with the interpretations kept visibly separate from the words.',
    arc: 'From the first light to the city with no need of sun',
    sections: [
      { h: 'What apocalyptic literature is',
        p: ['The word apocalypse means unveiling. As a literary genre it describes a particular kind of writing that flourished in Judaism and early Christianity roughly between the third century BCE and the second century CE: a narrative in which a human recipient is shown, by an angel or another heavenly figure, a reality normally hidden — the throne room of God, the structure of the cosmos, the meaning of history, or its end.',
             'Apocalyptic writing has recognisable habits. It uses vision rather than argument. It works in symbols whose meaning is sometimes explained and sometimes not. It uses numbers for significance as much as for quantity. It often comes to us under the name of an ancient figure — Enoch, Daniel, Ezra, Baruch — rather than its actual author. And it tends to appear when a community is under pressure, offering a view from above of a situation that looks, from below, hopeless.',
             'Recognising the genre is not a way of explaining these texts away. It is a way of reading them as their first audiences did: not as coded newspapers, but as literature designed to reframe a present crisis by placing it inside a larger frame.'] },
      { h: 'Why this site begins with Genesis',
        p: ['The last chapters of the Bible are written as a deliberate answer to its first. A garden with a river and a tree of life becomes a city with a river and a tree of life. A serpent that deceives becomes an ancient serpent judged. A curse on the ground is lifted. Cherubim who guard the way become gates that never close. Nations scattered at Babel are gathered from every language.',
             'Scholars have a shorthand for this correspondence: Urzeit gleicht Endzeit, primeval time resembles end time. It is not a decorative parallel; it determines what these texts think the end is for. The hope is not escape from creation but its restoration. That is why the chronology here opens at Genesis 1 rather than at the first explicit prophecy, and why a separate view sets each beginning beside its ending.'] },
      { h: 'How this site is built',
        p: ['Every event card separates two things that are usually blended. **What the text says** gives the description and the exact references. **How it has been read** gives the interpretations, each attributed to a named tradition. If a claim appears in the second block, it is interpretation — including interpretations held by large numbers of people for a long time.',
             'Where the order of events is disputed, the site does not choose. The chronology is organised into nine broad stages, and a separate view shows five different reconstructions of the sequence side by side, so that the disagreements are visible rather than hidden inside a single line.',
             'The Book of 1 Enoch appears throughout as a clearly marked comparative source. It is canonical in the Ethiopian Orthodox Tewahedo Church and is not canonical in Jewish, Catholic, Orthodox, or Protestant traditions. Its entries carry a dashed border and a comparative label, and can be filtered out entirely.'] },
      { h: 'What this site will not do',
        p: ['It will not calculate or predict a date for the end of the world. The texts themselves exclude this, and the historical record of attempts is uniform.',
             'It will not identify any contemporary person, government, religion, technology, or event as the fulfilment of a prophecy. Where a framework has historically made such identifications, that fact is recorded as part of describing the framework — not endorsed.',
             'It will not present a contested interpretation as an established fact, and it will not invent references, quotations, dates, or scholarly claims. Where the evidence is genuinely unsettled, the site says so.'] }
    ],
    howto: [
      { k: 'Chronology', v: 'Nine stages from Genesis to the new creation. Filter by book, testament, theme, tradition, certainty, or source; open any card for the full entry.' },

      { k: 'Contested order', v: 'Five interpretive reconstructions in parallel, with the specific points of divergence named.' },
      { k: 'Frameworks', v: 'Seven Christian frameworks plus three interpretive lenses; select up to three to compare directly.' },
      { k: '1 Enoch', v: 'The comparative source in full: its booklets, its themes, and the limits of what parallels can prove.' },
      { k: 'Canon survey', v: 'All sixty-six books assessed for relevant material, including those that have none.' },

  AD.data.methodology = {
    title: 'Methodology',
    lede: 'How the texts were selected, how they are organised, and what the labels mean.',
    sections: [
      { h: 'Selection',
        p: ['A passage is included when it makes a claim about the beginning of the world or about the end of the present age — its signs, its adversaries, its judgement, its consummation — or when it supplies imagery that the eschatological texts demonstrably reuse.',

        store.cycleTheme();
        AD.util.clear(themeBtn);
        themeBtn.appendChild(el('span', { class: 'ghost__label', text: themeLabel() }));
        themeBtn.setAttribute('aria-label', 'Reading surface theme: ' + themeLabel() + '. Activate to change.');
      }
    }, [el('span', { class: 'ghost__label', text: themeLabel() })]);

    var tools = [searchBtn, indexBtn, atlasBtn, studyBtn, themeBtn];

    if (AD.audio.available()) {
      soundBtn = el('button', {
        class: 'ghost', type: 'button', 'aria-pressed': 'false',
        'aria-label': 'Ambient sound, currently off. Activate to turn on.',
        onclick: function () {
          var on = AD.audio.toggle();
          soundBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
          soundBtn.setAttribute('aria-label', 'Ambient sound, currently ' + (on ? 'on' : 'off') + '. Activate to turn ' + (on ? 'off' : 'on') + '.');
          AD.util.clear(soundBtn);
          soundBtn.appendChild(icon(on ? SOUND_ON : SOUND_OFF));
          soundBtn.appendChild(el('span', { class: 'ghost__label', text: on ? 'Sound' : 'Muted' }));
          var note = document.getElementById('audioNote');
          if (note) { note.textContent = AD.audio.describe(); note.hidden = !on; }
        }
      }, [icon(SOUND_OFF), el('span', { class: 'ghost__label', text: 'Muted' })]);
      tools.splice(4, 0, soundBtn);
    }

    return el('div', { class: 'hud' }, [mark, el('div', { class: 'hud__tools' }, tools)]);
  }

  function buildScrub() {
    ticks = D.scenes.map(function (sc, i) {
      var b = el('button', {
        class: 'scrub__tick', type: 'button',
        'aria-label': 'Go to ' + sc.name,
        onclick: function () { AD.journey.goto(i); }
      }, [
        el('span', { text: sc.numeral ? 'Stage ' + sc.numeral : sc.name }),
        el('i', { 'aria-hidden': 'true' })
      ]);
      return b;
    });
    return el('nav', { class: 'scrub', 'aria-label': 'Timeline' }, ticks);
  }

  AD.hud = {
    progress: function (i, frac, global) {
      for (var k = 0; k < ticks.length; k++) {
        if (k === i) ticks[k].setAttribute('aria-current', 'true');
        else ticks[k].removeAttribute('aria-current');
      }
      if (railFill) railFill.style.width = (Math.min(Math.max(global, 0), 1) * 100).toFixed(2) + '%';
    }
  };

  function overture() {
    var node = el('div', { class: 'overture', id: 'overture', 'aria-hidden': 'true' }, [
      el('div', {}, [
        el('p', { class: 'overture__mark', text: 'The Appointed Time' }),
        el('p', { class: 'overture__sub', text: 'An interactive chronology · Genesis 1 — Revelation 22' })
      ])
    ]);
    var done = false;
    function dismiss() {
      if (done) return;
      done = true;
      node.classList.add('is-done');
      window.removeEventListener('scroll', dismiss);
      window.removeEventListener('pointerdown', dismiss);
      window.removeEventListener('keydown', dismiss);
      setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 1300);
    }
    window.addEventListener('scroll', dismiss, { passive: true });
    window.addEventListener('pointerdown', dismiss);
    window.addEventListener('keydown', dismiss);
    setTimeout(dismiss, 3200);
    return node;
  }

  function boot() {
    store.applyTheme(store.theme);

    var app = document.getElementById('app');
    railFill = el('i');
    app.appendChild(el('div', { class: 'railbar', 'aria-hidden': 'true' }, [railFill]));
    app.appendChild(buildHud());
    app.appendChild(buildScrub());

    app.appendChild(el('p', {
      class: 'audio-note', id: 'audioNote', hidden: true, role: 'status', 'aria-live': 'polite'
    }, 'Ambient sound is off.'));

    var main = el('main', { id: 'main', tabindex: '-1' });
    app.appendChild(main);
    AD.journey.mount(main);

    if (!AD.util.reducedMotion()) document.body.appendChild(overture());

    window.addEventListener('hashchange', function () {
      if (AD._silentHash) { AD._silentHash = false; return; }
      AD.router.apply();
    });

    document.addEventListener('keydown', function (e) {
      if (C.search.isOpen()) return;
      var tag = (e.target.tagName || '').toLowerCase();
      var typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
      if ((e.key === 'k' && (e.metaKey || e.ctrlKey)) || (e.key === '/' && !typing)) {
        e.preventDefault(); C.search.open();
      } else if (e.key === 'Escape' && AD.panel.isOpen()) {
        AD.panel.close();
      }
    });

    AD.router.apply();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window.AD);

</script>
